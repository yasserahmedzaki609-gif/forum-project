name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint + Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          SESSION_SECRET: ci_session_secret_that_is_long_enough_1234
          CSRF_SECRET: ci_csrf_secret_that_is_long_enough_5678
          DB_PATH: ":memory:"
          DB_PASSWORD: ""
          MEDIA_ROOT: "./media/test"
          BODY_LIMIT: "10kb"
